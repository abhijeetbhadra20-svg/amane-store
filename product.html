<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Amane Store</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f8f4ef;--paper:#fffdfa;--ink:#281f21;--muted:#746a6b;--line:#e6ddda;--wine:#6d2542;--ok:#287254}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',sans-serif}.nav{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1180px)/2))}.brand,h1{font-family:'Playfair Display',serif}.brand{font-size:25px;font-weight:700}.brand em{color:var(--wine)}a{text-decoration:none;color:inherit}.back{font-size:13px;font-weight:700;color:var(--muted)}main{max-width:1180px;margin:36px auto;padding:0 20px}.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(340px,.85fr);gap:48px}.gallery{background:#efe5e0;border-radius:30px;overflow:hidden;min-height:610px}.gallery img{width:100%;height:100%;display:block;object-fit:cover}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--wine)}h1{font-size:clamp(38px,5vw,58px);line-height:1;margin:10px 0}.price{font-size:27px;font-weight:700;margin:18px 0}.mrp{font-size:16px;color:#978d8e;text-decoration:line-through;margin-left:8px;font-weight:400}.discount{font-size:14px;color:var(--ok);margin-left:8px}.copy{color:var(--muted);font-size:16px}.rule{border:0;border-top:1px solid var(--line);margin:25px 0}.sizes{display:flex;gap:9px;flex-wrap:wrap}.size{min-width:52px;height:45px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:700;cursor:pointer}.size.selected{background:var(--ink);color:#fff}.actions{display:flex;gap:10px;margin-top:24px}.button{flex:1;min-height:54px;border:1px solid var(--wine);border-radius:15px;background:var(--wine);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.wish{flex:0 0 54px;background:#fff;color:var(--wine);font-size:23px}.details{margin-top:27px;border-top:1px solid var(--line)}.details div{padding:15px 0;border-bottom:1px solid var(--line);font-size:13px}.details b{display:block;margin-bottom:3px}.loading,.error{padding:80px 20px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:11px 15px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}@media(max-width:760px){.nav{height:64px;padding:0 20px}.layout{grid-template-columns:1fr;gap:25px}.gallery{min-height:440px;border-radius:22px}main{margin:20px auto}.copy{font-size:15px}}</style></head><body><header class="nav"><a class="brand" href="index.html">Amane <em>Store</em></a><a class="back" href="index.html#shop">← Continue shopping</a></header><main id="app"><div class="loading">Loading this style…</div></main><div id="toast" class="toast" role="status"></div><script>const URL='https://mthkwrtfruhgcjmuwjih.supabase.co',KEY='sb_publishable_HhSa_JJrkH06xHsv7_sgQQ_Gtz-zyGc',id=new URLSearchParams(location.search).get('id'),fallback={id:'amane-101',title:'Blush Bloom Kurti',code:'AM-101',category:'Kurtis',price:899,mrp:1299,discount:'30% off',color:'Blush',sizes:'S, M, L, XL',in_stock:true,img:'https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=1000&q=82'},money=n=>'₹'+Number(n||0).toLocaleString('en-IN');let product,size,wish=JSON.parse(localStorage.getItem('amane-wish')||'[]');function image(p){return Array.isArray(p.images)&&p.images[0]||p.img||fallback.img}function toast(x){const e=document.getElementById('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function render(){if(!product){app.innerHTML='<div class="error"><b>Style not found.</b><br><a href="index.html#shop">Return to the collection</a></div>';return}const sizes=String(product.sizes||'S, M, L, XL').split(',').map(x=>x.trim()).filter(Boolean);size=size||sizes[0];document.title=`${product.title||'Product'} — Amane Store`;app.innerHTML=`<div class="layout"><section class="gallery"><img src="${image(product)}" alt="${product.title||'Amane style'}"></section><section><div class="eyebrow">${product.category||'New in'} · ${product.code||''}</div><h1>${product.title||'Amane style'}</h1><div class="price">${money(product.price)} ${product.mrp?`<span class="mrp">${money(product.mrp)}</span>`:''}${product.discount?`<span class="discount">${product.discount}</span>`:''}</div><p class="copy">${product.color?product.color+' · ':''}An easy-to-wear Amane piece, selected for comfort, movement and everyday styling.</p><hr class="rule"><b>Choose your size</b><div class="sizes" id="sizes">${sizes.map(s=>`<button class="size ${s===size?'selected':''}" onclick="chooseSize(${JSON.stringify(s)})">${s}</button>`).join('')}</div><div class="actions"><button class="button" onclick="addToBag()">${product.in_stock===false?'Currently unavailable':'Add to bag'}</button><button class="button wish" onclick="toggleWish()" aria-label="Save to wishlist">${wish.includes(product.id)?'♥':'♡'}</button></div><div class="details"><div><b>Delivery</b>${product.delivery_text||'Delivery estimate is shown at checkout.'}</div><div><b>Returns</b>${product.return_text||'Easy returns subject to our policy.'}</div><div><b>Product code</b>${product.code||product.id||''}</div></div></section></div>`}function chooseSize(s){size=s;render()}function toggleWish(){wish=wish.includes(product.id)?wish.filter(x=>x!==product.id):[...wish,product.id];localStorage.setItem('amane-wish',JSON.stringify(wish));render();toast(wish.includes(product.id)?'Saved to wishlist':'Removed from wishlist')}function addToBag(){if(product.in_stock===false){toast('This style is currently unavailable');return}const cart=JSON.parse(localStorage.getItem('amane-cart')||'[]'),item=cart.find(x=>x.id===product.id&&x.size===size);item?item.qty++:cart.push({id:product.id,size,qty:1});localStorage.setItem('amane-cart',JSON.stringify(cart));toast('Added to your bag')}async function load(){try{await new Promise(r=>window.addEventListener('load',r,{once:true}));const db=window.supabase?.createClient(URL,KEY);if(!db||!id)throw Error();const {data,error}=await db.from('products').select('*').eq('id',id).maybeSingle();if(error)throw error;product=data||fallback}catch(e){product=id===fallback.id?fallback:null}render()}load();</script></body></html>
