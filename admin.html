<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal — Amane Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24">

    <!-- Admin Login Screen -->
    <div id="adminLoginScreen" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="text-center">
                <h2 class="text-lg font-black text-slate-900">ADMIN PORTAL</h2>
                <p class="text-xs text-slate-500 mt-0.5">Login with authorized Admin Credentials</p>
            </div>
            <form onsubmit="handleSupabaseAdminLogin(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Admin Email</label>
                    <input type="email" id="adminEmailInput" required placeholder="admin@amanestore.com" class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Password</label>
                    <input type="password" id="adminPasswordInput" required placeholder="••••••••" class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl shadow-md transition cursor-pointer">
                    Login to Dashboard
                </button>
            </form>
            <div class="text-center">
                <a href="index.html" class="text-[11px] text-slate-400 hover:underline">← Back to Storefront</a>
            </div>
        </div>
    </div>

    <!-- Main Admin Dashboard -->
    <div id="adminDashboardContent" class="hidden">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
            <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
                <div>
                    <h1 class="text-base font-black tracking-tight text-slate-900">ADMIN <span class="text-rose-600">DASHBOARD</span></h1>
                    <p class="text-[10px] text-slate-500 font-medium" id="loggedInUserEmail">Live Store Control Center</p>
                </div>
                <div class="flex items-center gap-2">
                    <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-xl transition">
                        <i class="fa-solid fa-store text-[10px] mr-1"></i> Store
                    </a>
                    <button onclick="adminLogout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold px-3 py-1.5 rounded-xl transition cursor-pointer">
                        <i class="fa-solid fa-right-from-bracket text-[10px] mr-1"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-3xl mx-auto px-4 mt-4 space-y-6">
            <!-- Add Product Section -->
            <section class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Add New Product</h2>
                <form onsubmit="handleAddNewProduct(event)" class="space-y-3 text-xs">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Product Code</label>
                            <input type="text" id="prodCode" required placeholder="e.g. D.NO-104" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Category (Custom)</label>
                            <input type="text" id="prodCategory" required placeholder="Kurti, Saree, etc." class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Product Title</label>
                        <input type="text" id="prodName" required placeholder="Designer Kurti Set" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Color</label>
                            <input type="text" id="prodColor" required placeholder="Pink" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Price (₹)</label>
                            <input type="number" id="prodPrice" required placeholder="899" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">MRP (₹)</label>
                            <input type="number" id="prodMrp" required placeholder="1299" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Product Image</label>
                        <input type="file" id="prodImageFile" accept="image/*" onchange="previewImageFile(event)" class="w-full p-2 border border-slate-200 rounded-xl text-xs mb-2 cursor-pointer">
                        <input type="url" id="prodImg" placeholder="Or Image URL..." class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                    </div>
                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow-md transition cursor-pointer">
                        Add Product to Store
                    </button>
                </form>
            </section>

            <!-- Product Manager -->
            <section class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Manage Products</h2>
                <div id="adminProductsList" class="space-y-3"></div>
            </section>

            <!-- Orders Section -->
            <section class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Customer Orders</h2>
                    <button onclick="fetchCustomerOrders()" class="text-[10px] text-rose-600 font-bold hover:underline cursor-pointer">
                        <i class="fa-solid fa-rotate mr-1"></i> Refresh Orders
                    </button>
                </div>
                <div id="adminOrdersList" class="space-y-3">
                    <p class="text-xs text-slate-400 text-center py-6">Loading orders...</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://mthkwrtfruhgcjmuwjih.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_HhSa_JJrkH06xHsv7_sgQQ_Gtz-zyGc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let uploadedImageBase64 = "";

        window.onload = async function() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                showDashboard(session.user.email);
            }
        };

        async function handleSupabaseAdminLogin(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmailInput').value.trim();
            const password = document.getElementById('adminPasswordInput').value;
            const btn = document.getElementById('loginBtn');

            btn.innerText = "Verifying...";
            btn.disabled = true;

            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert('Login Failed: ' + error.message);
                btn.innerText = "Login to Dashboard";
                btn.disabled = false;
            } else {
                showDashboard(data.user.email);
            }
        }

        function showDashboard(email) {
            document.getElementById('adminLoginScreen').classList.add('hidden');
            document.getElementById('adminDashboardContent').classList.remove('hidden');
            document.getElementById('loggedInUserEmail').innerText = `Logged in as: ${email}`;
            renderAdminProducts();
            fetchCustomerOrders();
        }

        async function adminLogout() {
            await _supabase.auth.signOut();
            location.reload();
        }

        function previewImageFile(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                    document.getElementById('prodImg').value = uploadedImageBase64;
                };
                reader.readAsDataURL(file);
            }
        }

        function handleAddNewProduct(e) {
            e.preventDefault();
            const code = document.getElementById('prodCode').value.trim();
            const category = document.getElementById('prodCategory').value.trim().toLowerCase();
            const title = document.getElementById('prodName').value.trim();
            const color = document.getElementById('prodColor').value.trim();
            const price = Number(document.getElementById('prodPrice').value);
            const mrp = Number(document.getElementById('prodMrp').value);
            const img = document.getElementById('prodImg').value.trim();

            if (!img) { alert('Please provide an image!'); return; }

            const newProduct = { id: 'prod_' + Date.now(), code, category, title, color, price, mrp, img, rating: '4.5', inStock: true };
            const existing = JSON.parse(localStorage.getItem('store_products')) || [];
            existing.unshift(newProduct);
            localStorage.setItem('store_products', JSON.stringify(existing));

            alert('Product added successfully!');
            e.target.reset();
            uploadedImageBase64 = "";
            renderAdminProducts();
        }

        function renderAdminProducts() {
            const container = document.getElementById('adminProductsList');
            const products = JSON.parse(localStorage.getItem('store_products')) || [];
            if (products.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">No products found.</p>`;
                return;
            }
            container.innerHTML = products.map((p, index) => `
                <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-xs gap-2">
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <img src="${p.img}" class="w-12 h-12 object-cover rounded-lg border shrink-0">
                        <div class="truncate">
                            <span class="bg-slate-900 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">${p.code}</span>
                            <h4 class="font-bold text-slate-800 mt-0.5 truncate">${p.title}</h4>
                            <p class="text-[10px] text-slate-500">₹${p.price} | Stock: <span class="${p.inStock !== false ? 'text-emerald-600 font-bold' : 'text-rose-600 font-bold'}">${p.inStock !== false ? 'Yes' : 'No'}</span></p>
                        </div>
                    </div>
                    <div class="flex gap-1 shrink-0">
                        <button onclick="toggleStock(${index})" class="bg-amber-50 text-amber-700 px-2.5 py-1.5 rounded-lg cursor-pointer text-[10px] font-bold" title="Toggle Stock">
                            <i class="fa-solid fa-box mr-1"></i> Stock
                        </button>
                        <button onclick="deleteAdminProduct(${index})" class="bg-rose-50 text-rose-600 p-2 rounded-lg cursor-pointer" title="Delete">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function toggleStock(index) {
            const products = JSON.parse(localStorage.getItem('store_products')) || [];
            products[index].inStock = products[index].inStock === false ? true : false;
            localStorage.setItem('store_products', JSON.stringify(products));
            renderAdminProducts();
        }

        function deleteAdminProduct(index) {
            if (confirm('Delete this product?')) {
                const products = JSON.parse(localStorage.getItem('store_products')) || [];
                products.splice(index, 1);
                localStorage.setItem('store_products', JSON.stringify(products));
                renderAdminProducts();
            }
        }

        async function fetchCustomerOrders() {
            const container = document.getElementById('adminOrdersList');
            container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Loading orders...</p>`;
            try {
                const { data: orders, error } = await _supabase.from('orders').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                if (!orders || orders.length === 0) {
                    container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">No orders found.</p>`;
                    return;
                }
                container.innerHTML = orders.map(order => {
                    const status = order.status || 'Pending';
                    const badgeColor = status === 'Delivered' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700';
                    return `
                        <div class="bg-slate-50 rounded-xl border border-slate-200 p-3 text-xs space-y-2">
                            <div class="flex items-center justify-between border-b pb-2">
                                <div><span class="font-black">${order.customer_name || 'Customer'}</span> <span class="text-slate-400">(${order.phone || 'N/A'})</span></div>
                                <span class="${badgeColor} font-extrabold text-[10px] px-2.5 py-0.5 rounded-full">${status}</span>
                            </div>
                            <div class="text-[11px] text-slate-600 space-y-0.5">
                                <p><b>Address:</b> ${order.address || ''}, ${order.landmark || ''}, ${order.city_state || ''} - ${order.pincode || ''}</p>
                                <p><b>Size:</b> ${order.size || 'N/A'} | <b>Payment:</b> ${order.payment_mode || 'COD'}</p>
                            </div>
                            <div class="flex items-center justify-between pt-1 border-t font-bold">
                                <span>Total: ₹${order.total_amount || 0}</span>
                                <div class="flex gap-1">
                                    <button onclick="updateOrderStatus('${order.id}', 'Delivered')" class="bg-emerald-50 text-emerald-700 px-2 py-1 rounded cursor-pointer text-[10px]">Mark Delivered</button>
                                    <button onclick="deleteCustomerOrder('${order.id}')" class="bg-rose-50 text-rose-600 px-2 py-1 rounded cursor-pointer text-[10px]">Delete</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch(err) {
                container.innerHTML = `<p class="text-xs text-rose-500 text-center py-6">Error loading orders from database.</p>`;
            }
        }

        async function updateOrderStatus(id, status) {
            const { error } = await _supabase.from('orders').update({ status }).eq('id', id);
            if (error) {
                alert('Error updating status: ' + error.message);
            } else {
                fetchCustomerOrders();
            }
        }

        async function deleteCustomerOrder(id) {
            if (confirm('Permanently delete this order from database?')) {
                const { error } = await _supabase.from('orders').delete().eq('id', id);
                if (error) {
                    alert('Error deleting order: ' + error.message);
                } else {
                    fetchCustomerOrders();
                }
            }
        }
    </script>
</body>
</html>
