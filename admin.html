<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amane Store — Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-rose-50/30 to-pink-100/40 text-slate-800 font-sans pb-24 min-h-screen">

    <!-- Header -->
    <header class="glass-nav border-b border-white/50 sticky top-0 z-30 shadow-xs">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-base font-black tracking-tight text-slate-900">AMANE <span class="text-rose-600">ADMIN</span></h1>
            <a href="index.html" class="text-xs bg-slate-900 text-white font-bold px-3.5 py-1.5 rounded-xl shadow-xs">View Store</a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-4 space-y-4">
        <!-- Add Product Form Card -->
        <div class="glass-card rounded-3xl p-5 shadow-lg border border-white/80 space-y-4">
            <h2 class="text-sm font-black uppercase text-slate-900 border-b border-slate-200/60 pb-2">Add New Product</h2>
            <form onsubmit="handleAddNewProduct(event)" class="space-y-3 text-xs">
                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Product Title</label>
                        <input type="text" id="prodTitle" required placeholder="e.g. Short Kurti Cotton" class="w-full p-2.5 glass-card rounded-xl border border-white/80 outline-none focus:border-rose-600">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Product Code (D.No)</label>
                        <input type="text" id="prodCode" required placeholder="e.g. D.No.10049" class="w-full p-2.5 glass-card rounded-xl border border-white/80 outline-none focus:border-rose-600">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2.5">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Price (₹)</label>
                        <input type="number" id="prodPrice" required placeholder="899" class="w-full p-2.5 glass-card rounded-xl border border-white/80 outline-none focus:border-rose-600">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">MRP (₹)</label>
                        <input type="number" id="prodMrp" required placeholder="1299" class="w-full p-2.5 glass-card rounded-xl border border-white/80 outline-none focus:border-rose-600">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Discount Tag</label>
                        <input type="text" id="prodDiscount" placeholder="14% off" class="w-full p-2.5 glass-card rounded-xl border border-white/80 outline-none focus:border-rose-600">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Category</label>
                        <input type="text" id="prodCategory" required placeholder="Short Kurti / Western" class="w-full p-2.5 glass-card rounded-xl border border-white/80 outline-none focus:border-rose-600">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Color / Variant</label>
                        <input type="text" id="prodColor" required placeholder="Purple / Lilac" class="w-full p-2.5 glass-card rounded-xl border border-white/80 outline-none focus:border-rose-600">
                    </div>
                </div>

                <!-- File & Camera Image Picker -->
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Upload Product Images <span class="text-[10px] text-slate-400">(Select multiple: Front, Back, Side etc.)</span></label>
                    <input type="file" id="prodImageFiles" accept="image/*" multiple onchange="handleImageSelection(event)" class="w-full p-2 glass-card rounded-xl border border-white/80 text-[11px] file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-rose-600 file:text-white hover:file:bg-rose-700 cursor-pointer">
                    <div id="imagePreviewContainer" class="flex gap-2 mt-2 overflow-x-auto"></div>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Custom Delivery Text</label>
                        <input type="text" id="prodDelivery" value="Free Delivery across India" placeholder="Free Delivery across India" class="w-full p-2.5 glass-card rounded-xl border border-white/80 outline-none focus:border-rose-600">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Custom Returns Text</label>
                        <input type="text" id="prodReturns" value="Easy 7-day returns & exchange" placeholder="Easy 7-day returns" class="w-full p-2.5 glass-card rounded-xl border border-white/80 outline-none focus:border-rose-600">
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-1">Sizes (Comma separated)</label>
                    <input type="text" id="prodSizes" value="S, M, L, XL, XXL" placeholder="S, M, L, XL" class="w-full p-2.5 glass-card rounded-xl border border-white/80 outline-none focus:border-rose-600">
                </div>

                <button type="submit" id="publishBtn" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-extrabold py-3 rounded-xl shadow-md transition cursor-pointer">
                    Publish Product
                </button>
            </form>
        </div>

        <!-- Manage Existing Products -->
        <div class="glass-card rounded-3xl p-5 shadow-lg border border-white/80 space-y-3">
            <h2 class="text-sm font-black uppercase text-slate-900 border-b border-slate-200/60 pb-2">Manage Store Products</h2>
            <div id="adminProductsList" class="space-y-2">
                <p class="text-xs text-slate-400 text-center py-4">Loading inventory...</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://mthkwrtfruhgcjmuwjih.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_HhSa_JJrkH06xHsv7_sgQQ_Gtz-zyGc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let uploadedBase64Images = [];

        window.onload = function() {
            renderAdminProducts();
        };

        function getProducts() {
            return JSON.parse(localStorage.getItem('store_products')) || [];
        }

        function saveProducts(products) {
            localStorage.setItem('store_products', JSON.stringify(products));
        }

        async function handleImageSelection(event) {
            const files = event.target.files;
            uploadedBase64Images = [];
            const previewContainer = document.getElementById('imagePreviewContainer');
            previewContainer.innerHTML = '';

            if (!files || files.length === 0) return;

            for (let file of files) {
                const base64 = await convertFileToBase64(file);
                uploadedBase64Images.push(base64);

                const imgTag = document.createElement('img');
                imgTag.src = base64;
                imgTag.className = "w-14 h-14 object-cover rounded-xl border border-white shadow-xs shrink-0";
                previewContainer.appendChild(imgTag);
            }
        }

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        async function handleAddNewProduct(e) {
            e.preventDefault();
            if (uploadedBase64Images.length === 0) {
                alert('Please select at least one product image!');
                return;
            }

            const title = document.getElementById('prodTitle').value.trim();
            const code = document.getElementById('prodCode').value.trim();
            const price = parseFloat(document.getElementById('prodPrice').value);
            const mrp = parseFloat(document.getElementById('prodMrp').value);
            const discount = document.getElementById('prodDiscount').value.trim();
            const category = document.getElementById('prodCategory').value.trim();
            const color = document.getElementById('prodColor').value.trim();
            const deliveryText = document.getElementById('prodDelivery').value.trim();
            const returnText = document.getElementById('prodReturns').value.trim();
            const sizes = document.getElementById('prodSizes').value.trim();

            let imagesString = uploadedBase64Images.join(',');
            let firstImg = uploadedBase64Images[0];

            const newProduct = {
                id: 'prod_' + Date.now(),
                title,
                code,
                price,
                mrp,
                discount,
                category,
                color,
                images: imagesString,
                img: firstImg,
                deliveryText,
                returnText,
                sizes,
                inStock: true
            };

            const products = getProducts();
            products.unshift(newProduct);
            saveProducts(products);

            alert('Product added successfully!');
            e.target.reset();
            uploadedBase64Images = [];
            document.getElementById('imagePreviewContainer').innerHTML = '';
            renderAdminProducts();
        }

        function renderAdminProducts() {
            const products = getProducts();
            const listEl = document.getElementById('adminProductsList');

            if (products.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">No products added yet.</p>`;
                return;
            }

            listEl.innerHTML = products.map((p, index) => `
                <div class="flex items-center justify-between bg-white/60 p-2.5 rounded-2xl border border-white/80 text-xs gap-3">
                    <img src="${p.img}" class="w-10 h-10 object-cover rounded-xl border shrink-0">
                    <div class="flex-1 truncate">
                        <h4 class="font-bold text-slate-900 truncate">${p.title}</h4>
                        <p class="text-[10px] text-slate-500">${p.code} | ₹${p.price} ${p.discount ? '• ' + p.discount : ''}</p>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button onclick="toggleStock('${p.id}')" class="px-2.5 py-1 rounded-xl text-[10px] font-extrabold ${p.inStock !== false ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'} cursor-pointer">
                            ${p.inStock !== false ? 'In Stock' : 'Out of Stock'}
                        </button>
                        <button onclick="deleteProduct('${p.id}')" class="w-7 h-7 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center cursor-pointer hover:bg-rose-100">
                            <i class="fa-solid fa-trash text-[10px]"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function toggleStock(prodId) {
            let products = getProducts();
            const p = products.find(x => x.id === prodId);
            if (p) {
                p.inStock = p.inStock === false ? true : false;
                saveProducts(products);
                renderAdminProducts();
            }
        }

        function deleteProduct(prodId) {
            if (confirm('Are you sure you want to delete this product?')) {
                let products = getProducts();
                products = products.filter(x => x.id !== prodId);
                saveProducts(products);
                renderAdminProducts();
            }
        }
    </script>
</body>
</html>
