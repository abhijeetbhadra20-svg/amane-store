<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Amane Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased pb-20">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div>
                <h1 class="text-base font-black tracking-tight text-slate-900">ADMIN <span class="text-rose-600">DASHBOARD</span></h1>
                <p class="text-[10px] text-slate-500 font-medium">Product & Order Control Center</p>
            </div>
            <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-xl transition">
                <i class="fa-solid fa-store text-[10px] mr-1"></i> View Store
            </a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-4 space-y-6">
        
        <!-- Add New Product Card -->
        <section class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Add New Product</h2>
            
            <form onsubmit="handleAddNewProduct(event)" class="space-y-3 text-xs">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Product Code</label>
                        <input type="text" id="prodCode" required placeholder="e.g. D.NO-103" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Category</label>
                        <select id="prodCategory" required class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600 bg-white">
                            <option value="kurti">Kurti</option>
                            <option value="suit">Suit</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-1">Product Title / Name</label>
                    <input type="text" id="prodName" required placeholder="e.g. Embroidered Georgette Kurti" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Color</label>
                        <input type="text" id="prodColor" required placeholder="e.g. Blue" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Selling Price (₹)</label>
                        <input type="number" id="prodPrice" required placeholder="899" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">MRP (₹)</label>
                        <input type="number" id="prodMrp" required placeholder="1299" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-1">Image URL</label>
                    <input type="url" id="prodImg" required placeholder="https://images.unsplash.com/..." class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:border-rose-600">
                </div>

                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow-md transition cursor-pointer">
                    Add Product to Store
                </button>
            </form>
        </section>

        <!-- Existing Products Management -->
        <section class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Existing Products (Manage / Delete)</h2>
            <div id="adminProductsList" class="space-y-3">
                <!-- Loaded via JS -->
            </div>
        </section>

        <!-- Customer Orders Section -->
        <section class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Customer Orders</h2>
                <button onclick="fetchCustomerOrders()" class="text-[10px] text-rose-600 font-bold hover:underline cursor-pointer">
                    <i class="fa-solid fa-rotate mr-1">Refresh Orders</i>
                </button>
            </div>
            <div id="adminOrdersList" class="space-y-3">
                <p class="text-xs text-slate-400 text-center py-6">Loading customer orders...</p>
            </div>
        </section>

    </main>

    <!-- Script Logic -->
    <script>
        // Supabase Init
        const SUPABASE_URL = 'https://mthkwrtfruhgcjmuwjih.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_HhSa_JJrkH06xHsv7_sgQQ_Gtz-zyGc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Load Products & Orders on Startup
        window.onload = function() {
            renderAdminProducts();
            fetchCustomerOrders();
        };

        // Add Product Logic
        function handleAddNewProduct(e) {
            e.preventDefault();
            const code = document.getElementById('prodCode').value.trim();
            const category = document.getElementById('prodCategory').value;
            const title = document.getElementById('prodName').value.trim();
            const color = document.getElementById('prodColor').value.trim();
            const price = Number(document.getElementById('prodPrice').value);
            const mrp = Number(document.getElementById('prodMrp').value);
            const img = document.getElementById('prodImg').value.trim();

            const newProduct = {
                id: 'prod_' + Date.now(),
                code,
                category,
                title,
                color,
                price,
                mrp,
                img,
                rating: '4.5'
            };

            const existing = JSON.parse(localStorage.getItem('store_products')) || [];
            existing.unshift(newProduct);
            localStorage.setItem('store_products', JSON.stringify(existing));

            alert('Product successfully added!');
            e.target.reset();
            renderAdminProducts();
        }

        // Render Admin Products List
        function renderAdminProducts() {
            const container = document.getElementById('adminProductsList');
            if (!container) return;

            const products = JSON.parse(localStorage.getItem('store_products')) || [];

            if (products.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">No custom products added yet.</p>`;
                return;
            }

            container.innerHTML = products.map((p, index) => `
                <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-xs">
                    <div class="flex items-center gap-2.5">
                        <img src="${p.img}" class="w-12 h-12 object-cover rounded-lg border border-slate-200">
                        <div>
                            <span class="bg-slate-900 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">${p.code}</span>
                            <h4 class="font-bold text-slate-800 mt-0.5">${p.title}</h4>
                            <p class="text-[10px] text-slate-500">₹${p.price} <span class="line-through text-slate-400">₹${p.mrp}</span> | Color: ${p.color}</p>
                        </div>
                    </div>
                    <button onclick="deleteAdminProduct(${index})" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-lg transition cursor-pointer">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `).join('');
        }

        function deleteAdminProduct(index) {
            if (confirm('Are you sure you want to delete this product?')) {
                const products = JSON.parse(localStorage.getItem('store_products')) || [];
                products.splice(index, 1);
                localStorage.setItem('store_products', JSON.stringify(products));
                renderAdminProducts();
            }
        }

        // Fetch Customer Orders from Supabase
        async function fetchCustomerOrders() {
            const container = document.getElementById('adminOrdersList');
            if (!container) return;

            container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Fetching orders from database...</p>`;

            try {
                const { data: orders, error } = await _supabase
                    .from('orders')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!orders || orders.length === 0) {
                    container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">No customer orders received yet.</p>`;
                    return;
                }

                container.innerHTML = orders.map(order => {
                    let itemsHtml = '';
                    try {
                        const parsedItems = typeof order.items === 'string' ? JSON.parse(order.items) : order.items;
                        itemsHtml = parsedItems.map(i => `<div class="text-[11px] text-slate-600">• ${i.code} - ${i.title} [Size: ${order.size}] (x${i.qty}) - ₹${i.price * i.qty}</div>`).join('');
                    } catch(e) {
                        itemsHtml = `<div class="text-[11px] text-slate-600">${JSON.stringify(order.items)}</div>`;
                    }

                    return `
                        <div class="bg-slate-50 rounded-xl border border-slate-200 p-3 text-xs space-y-2">
                            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                                <div>
                                    <span class="font-black text-slate-900">${order.customer_name}</span>
                                    <span class="text-[10px] text-slate-400 ml-1">(${order.phone})</span>
                                </div>
                                <span class="bg-amber-100 text-amber-700 font-extrabold text-[10px] px-2 py-0.5 rounded-full">${order.status || 'Pending'}</span>
                            </div>
                            <div>
                                <p class="font-bold text-slate-700 text-[10px] uppercase mb-1">Ordered Items:</p>
                                ${itemsHtml}
                            </div>
                            <div class="text-[11px] text-slate-600 pt-1 border-t border-slate-200">
                                <span class="font-bold">Shipping Address:</span> ${order.address} (Pincode: ${order.pincode})
                            </div>
                            <div class="flex items-center justify-between pt-1 font-bold text-slate-900">
                                <span>Total Amount:</span>
                                <span class="text-rose-600 text-sm">₹${order.total_amount}</span>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('Error fetching orders:', err);
                container.innerHTML = `<p class="text-xs text-rose-500 text-center py-6">Failed to load orders. Check console for details.</p>`;
            }
        }
    </script>
</body>
</html>
