<!-- Admin Product & Order Management Section -->
<div class="admin-container" style="padding: 20px; font-family: sans-serif;">
    <h2>Admin Dashboard — Product & Order Control</h2>
    
    <!-- Add Product Form -->
    <div style="background: #f9f9f9; padding: 15px; margin-bottom: 20px; border: 1px solid #ddd;">
<h3>Add New Product</h3>
        <input type="text" id="prodName" placeholder="Product Name (e.g. Oversized Tee)" style="margin: 5px; padding: 8px; width: 100%;">
        <input type="number" id="prodPrice" placeholder="Selling Price (₹)" style="margin: 5px; padding: 8px; width: 48%;">
        <input type="number" id="prodMrp" placeholder="MRP (₹)" style="margin: 5px; padding: 8px; width: 48%;">
        <input type="text" id="prodImg" placeholder="Image URL" style="margin: 5px; padding: 8px; width: 100%;">
        <button onclick="addNewProduct()" style="background: black; color: white; padding: 10px 15px; border: none; cursor: pointer; margin-top: 10px;">Add Product to Store</button>
    </div>

    <!-- Product List Management -->
    <h3>Existing Products (Manage / Delete)</h3>
    <div id="adminProductList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px;">
        <!-- Dynamic Products will load here -->
    </div>

    <!-- Orders Section -->
    <h3>Customer Orders</h3>
    <div id="adminOrdersList">
        <!-- Orders from Supabase/Storage -->
    </div>
</div>

<script>
    // Local state ya Supabase ke sath sync ke liye core logic
    let products = JSON.parse(localStorage.getItem('store_products')) || [
        { id: 1, name: "Black Oversized Tee", price: 699, mrp: 1299, img: "https://via.placeholder.com/150" }
    ];

    function renderAdminProducts() {
        const container = document.getElementById('adminProductList');
        container.innerHTML = '';
        products.forEach((p, index) => {
            container.innerHTML += `
                <div style="border: 1px solid #ccc; padding: 10px; background: #fff;">
                    <img src="${p.img}" alt="" style="width: 100%; height: 120px; object-fit: cover;">
                    <h4>${p.name}</h4>
                    <p>₹${p.price} <del>₹${p.mrp}</del></p>
                    <button onclick="deleteProduct(${index})" style="background: red; color: white; border: none; padding: 5px 10px; cursor: pointer; width: 100%;">Delete Product</button>
                </div>
            `;
        });
        localStorage.setItem('store_products', JSON.stringify(products));
    }

    function addNewProduct() {
        const name = document.getElementById('prodName').value;
        const price = document.getElementById('prodPrice').value;
        const mrp = document.getElementById('prodMrp').value;
        const img = document.getElementById('prodImg').value;

        if(!name || !price) {
            alert('Product name and price are required!');
            return;
        }

        products.push({ id: Date.now(), name, price, mrp, img: img || 'https://via.placeholder.com/150' });
        renderAdminProducts();
        alert('Product added successfully!');
        
        // Clear inputs
        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodMrp').value = '';
        document.getElementById('prodImg').value = '';
    }

    function deleteProduct(index) {
        if(confirm('Are you sure you want to delete this product?')) {
            products.splice(index, 1);
            renderAdminProducts();
        }
    }

    // Initial render call for admin
    renderAdminProducts();
            </script>
