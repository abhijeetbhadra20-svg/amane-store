<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Femme &amp; Co.</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">

<section class="max-w-4xl mx-auto px-5 py-10">
  <h1 class="display text-3xl mb-8">Your cart</h1>
  <div id="cart-items" class="flex flex-col gap-4"></div>
  <div id="empty-cart" class="hidden text-center py-16" style="color:var(--plum-soft)">
    Your cart is empty. <a href="shop.html" class="underline">Start shopping</a>
  </div>

  <div id="summary" class="card p-5 mt-8 max-w-sm ml-auto">
    <div class="flex justify-between text-sm mb-2"><span>Subtotal</span><span id="subtotal">₹0</span></div>
    <div class="flex justify-between text-sm mb-2"><span>Shipping</span><span id="shipping-cost">Free</span></div>
    <hr class="stitch my-3">
    <div class="flex justify-between font-bold mb-4"><span>Total</span><span id="total">₹0</span></div>
    <a href="checkout.html" class="btn btn-primary btn-block">Proceed to checkout</a>
  </div>
</section>

<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
  function render(){
    const cart = Store.getCart();
    const wrap = document.getElementById("cart-items");
    document.getElementById("empty-cart").classList.toggle("hidden", cart.length>0);
    document.getElementById("summary").classList.toggle("hidden", cart.length===0);

    wrap.innerHTML = cart.map(item=>{
      const p = Store.getProduct(item.productId);
      if(!p) return "";
      return `
      <div class="card p-4 flex gap-4 items-center">
        <img src="${p.img}" alt="${p.name}" class="w-20 h-24 object-cover">
        <div class="flex-1">
          <div class="text-sm font-bold">${p.name}</div>
          <div class="text-xs mt-1" style="color:var(--plum-soft)">Size: ${item.size}</div>
          <div class="price text-sm mt-1">₹${p.price}</div>
        </div>
        <div class="flex items-center gap-2">
          <button class="btn btn-outline" style="padding:0.3rem 0.6rem" onclick="changeQty('${item.productId}','${item.size}',${item.qty-1})">-</button>
          <span class="text-sm w-5 text-center">${item.qty}</span>
          <button class="btn btn-outline" style="padding:0.3rem 0.6rem" onclick="changeQty('${item.productId}','${item.size}',${item.qty+1})">+</button>
        </div>
        <button class="text-xs underline" style="color:var(--plum-soft)" onclick="removeItem('${item.productId}','${item.size}')">Remove</button>
      </div>`;
    }).join("");

    const subtotal = Store.cartTotal();
    document.getElementById("subtotal").textContent = "₹" + subtotal;
    document.getElementById("total").textContent = "₹" + subtotal;
  }
  function changeQty(id, size, qty){ Store.updateCartQty(id, size, qty); render(); }
  function removeItem(id, size){ Store.removeFromCart(id, size); render(); Store.toast("Removed from cart"); }
  render();
</script>
</body>
</html>
