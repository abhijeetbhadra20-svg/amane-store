    <script>
        // Supabase Init
        const SUPABASE_URL = 'https://mthkwrtfruhgcjmuwjih.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_HhSa_JJrkH06xHsv7_sgQQ_Gtz-zyGc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // EmailJS Init
        (function(){
            emailjs.init("K9W-iJ7cQJIn1O-mK");
        })();

        let cart = [];

        // Dynamic & Local Storage Products Sync (Admin Panel Integration)
        function getStoredProducts() {
            const defaultStaticProducts = [
                { id: '101', code: 'D.NO-101', category: 'kurti', title: 'Designer Kurti Set', color: 'Pink', price: 899, mrp: 1299, rating: '4.5', img: 'https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=500' },
                { id: '102', code: 'D.NO-102', category: 'suit', title: 'Rayon Anarkali Suit', color: 'Maroon', price: 1199, mrp: 1699, rating: '4.8', img: 'https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=500' }
            ];
            const localCustomProducts = JSON.parse(localStorage.getItem('store_products')) || [];
            return [...defaultStaticProducts, ...localCustomProducts];
        }

        function renderShopProducts(productsToRender = null) {
            const productsGrid = document.getElementById('productsGrid');
            const products = productsToRender || getStoredProducts();
            
            productsGrid.innerHTML = products.map(p => `
                <div class="product-card bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden flex flex-col justify-between hover:shadow-md transition" data-category="${p.category || 'kurti'}" data-title="${p.title.toLowerCase()} ${p.color ? p.color.toLowerCase() : ''}" data-code="${p.code.toLowerCase()}">
                    <div>
                        <div class="relative bg-slate-100 aspect-3/4 overflow-hidden group">
                            <img src="${p.img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <span class="absolute top-2 left-2 bg-slate-900/80 backdrop-blur-xs text-white text-[9px] font-bold px-2 py-0.5 rounded-md">${p.code}</span>
                            <span class="absolute bottom-2 left-2 bg-emerald-600 text-white text-[9px] font-extrabold px-1.5 py-0.5 rounded flex items-center gap-0.5">
                                ${p.rating || '4.5'} <i class="fa-solid fa-star text-[8px]"></i>
                            </span>
                        </div>
                        <div class="p-2.5">
                            <p class="text-[10px] text-slate-400 font-medium">Amane Exclusive</p>
                            <h3 class="font-bold text-xs text-slate-800 truncate leading-tight">${p.title}</h3>
                            <p class="text-[10px] text-slate-500 my-0.5">Color: ${p.color || 'Standard'}</p>
                            
                            <div class="flex items-baseline gap-1.5 mt-1">
                                <span class="text-sm font-black text-slate-900">₹${p.price}</span>
                                <span class="text-[10px] text-slate-400 line-through">₹${p.mrp}</span>
                                <span class="text-[10px] font-bold text-emerald-600">${Math.round(((p.mrp - p.price)/p.mrp)*100)}% off</span>
                            </div>
                            <p class="text-[9px] font-semibold text-emerald-700 mt-0.5">Free Delivery</p>
                        </div>
                    </div>
                    <div class="p-2.5 pt-0">
                        <button onclick="addToCart('${p.id}', '${p.code}', '${p.title}', ${p.price}, '${p.img}')" class="w-full bg-rose-600 hover:bg-rose-700 active:scale-98 text-white font-bold text-[11px] py-2 rounded-lg shadow-xs transition cursor-pointer flex items-center justify-center gap-1">
                            <i class="fa-solid fa-cart-plus text-xs"></i> Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');

            document.getElementById('productCountBadge').innerText = `${products.length} Items`;
        }

        // Live Search Handler
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const clearBtn = document.getElementById('clearSearchBtn');
            const cards = document.querySelectorAll('.product-card');
            const noResults = document.getElementById('noResults');
            let visibleCount = 0;

            if (query.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');

            cards.forEach(card => {
                const title = card.getAttribute('data-title') || '';
                const code = card.getAttribute('data-code') || '';

                if (title.includes(query) || code.includes(query)) {
                    card.classList.remove('hidden');
                    visibleCount++;
                } else {
                    card.classList.add('hidden');
                }
            });

            document.getElementById('productCountBadge').innerText = `${visibleCount} Items`;
            if (visibleCount === 0) noResults.classList.remove('hidden');
            else noResults.classList.add('hidden');
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            handleSearch();
        }

        // Category Filter
        function filterCategory(category) {
            const cards = document.querySelectorAll('.product-card');
            const badges = document.querySelectorAll('.cat-badge');
            
            badges.forEach(b =>  {
                b.classList.remove('bg-rose-600', 'text-white', 'shadow-xs');
                b.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
            });

            event.target.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
            event.target.classList.add('bg-rose-600', 'text-white', 'shadow-xs');

            let visibleCount = 0;
            cards.forEach(card => {
                const cat = card.getAttribute('data-category');
                if (category === 'all' || cat === category) {
                    card.classList.remove('hidden');
                    visibleCount++;
                } else {
                    card.classList.add('hidden');
                }
            });

            document.getElementById('productCountBadge').innerText = `${visibleCount} Items`;
        }

        // Cart Drawer Logic
        function toggleCartDrawer(forceOpen = false) {
            const drawer = document.getElementById('cartDrawer');
            if (forceOpen) drawer.classList.remove('hidden');
            else drawer.classList.toggle('hidden');
        }

        function openCheckoutModal() {
            if (cart.length === 0) {
                alert('Pehle cart me koi item add karo!');
                return;
            }
            toggleCartDrawer(false);
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        function closeSuccessModal() {
            document.getElementById('successModal').classList.add('hidden');
        }

        function addToCart(id, code, title, price, img) {
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id, code, title, price, img, qty: 1 });
            }
            updateCartUI();
            toggleCartDrawer(true);
        }

        function updateCartUI() {
            const container = document.getElementById('cartItemsContainer');
            const totalBadge = document.getElementById('cartCountBadge');
            const grandTotal = document.getElementById('cartGrandTotal');

            const totalItems = cart.reduce((acc, item) => acc + item.qty, 0);
            const totalSum = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

            totalBadge.innerText = totalItems;
            grandTotal.innerText = `₹${totalSum}`;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-xs text-center text-slate-400 py-10">Your cart is empty.</p>`;
                return;
            }

            container.innerHTML = cart.map((item, index) => `
                <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-xs">
                    <div class="flex items-center gap-2">
                        <img src="${item.img}" class="w-12 h-12 object-cover rounded-lg border border-slate-200">
                        <div>
                            <p class="font-bold text-slate-800">${item.code}</p>
                            <p class="text-[10px] text-slate-500">${item.title}</p>
                            <p class="text-[11px] font-extrabold text-rose-600 mt-0.5">₹${item.price} x ${item.qty}</p>
                        </div>
                    </div>
                    <button onclick="removeFromCart(${index})" class="text-slate-400 hover:text-rose-600 text-xs p-1.5 cursor-pointer transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `).join('');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        // Checkout, Supabase Insert & EmailJS Notification
        async function handleCheckoutSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = 'Placing Order...';
            submitBtn.disabled = true;

            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const size = document.getElementById('custSize').value;
            const pincode = document.getElementById('custPincode').value;
            const flat = document.getElementById('custFlat').value;
            const area = document.getElementById('custArea').value;
            const landmark = document.getElementById('custLandmark').value;
            const cityState = document.getElementById('custCityState').value;

            const fullAddress = `${flat}, ${area}${landmark ? ', Near ' + landmark : ''}, ${cityState} - ${pincode}`;
            const totalSum = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const itemList = cart.map(i => `${i.code} (${i.title}) [Size: ${size}] x ${i.qty}`).join(', ');

            try {
                // 1. Save to Supabase Database
                const { error } = await _supabase.from('orders').insert([
                    {
                        customer_name: name,
                        phone: phone,
                        size: size,
                        pincode: pincode,
                        address: fullAddress,
                        items: cart,
                        total_amount: totalSum,
                        status: 'Pending'
                    }
                ]);

                if (error) throw error;

                // 2. Trigger EmailJS Notification
                await emailjs.send('default_service', 'template_id', {
                    customer_name: name,
                    customer_phone: phone,
                    customer_address: fullAddress,
                    order_items: itemList,
                    total_amount: `₹${totalSum}`
                });

                // Success Actions
                closeCheckoutModal();
                cart = [];
                updateCartUI();
                document.getElementById('successModal').classList.remove('hidden');

            } catch (err) {
                console.error('Order Error:', err);
                alert('Order place karne me kuch dikkat aayi. Kripya dubara try karein.');
            } finally {
                submitBtn.innerText = 'Place Order (Cash On Delivery)';
                submitBtn.disabled = false;
            }
        }

        // Initialize Shop on Page Load
        window.onload = function() {
            renderShopProducts();
        };
                    </script>
