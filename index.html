<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amane Store | Ethnic Wear</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24">

    <!-- ANNOUNCEMENT BAR -->
    <div class="bg-gradient-to-r from-amber-600 to-rose-600 text-white text-xs text-center py-2 px-4 font-medium shadow-md">
        🔥 Direct Manufacturer Rates | Express Shipping All Over India!
    </div>

    <!-- NAVBAR -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-xs">
        <div class="flex items-center gap-2">
            <span class="bg-rose-600 text-white font-black text-xl px-2.5 py-0.5 rounded-lg">A</span>
            <div>
                <h1 class="text-base font-bold text-slate-900 leading-tight">Amane Store</h1>
                <p class="text-[9px] text-slate-500 font-medium">100% Factory Quality</p>
            </div>
        </div>
        
        <!-- Cart & Placeholder Login Button -->
        <div class="flex items-center gap-3">
            <button class="relative text-slate-700">
                <i class="fa-solid fa-bag-shopping text-xl"></i>
                <span class="absolute -top-2 -right-2 bg-rose-600 text-white text-[10px] font-extrabold w-4 h-4 rounded-full flex items-center justify-center">0</span>
            </button>
            <button class="text-xs bg-slate-900 text-white font-semibold px-3 py-1.5 rounded-full flex items-center gap-1 opacity-80 cursor-not-allowed">
                <i class="fa-solid fa-user-lock text-[10px]"></i> Login (Step 2)
            </button>
        </div>
    </header>

    <!-- TRUST BADGES -->
    <section class="max-w-6xl mx-auto px-4 my-4">
        <div class="grid grid-cols-3 gap-2 bg-white p-3 rounded-xl border border-slate-200 text-center text-[11px]">
            <div><i class="fa-solid fa-shield-halved text-rose-600 mb-1 text-sm"></i><p class="font-bold">Quality Assured</p></div>
            <div class="border-x border-slate-100"><i class="fa-solid fa-truck-fast text-rose-600 mb-1 text-sm"></i><p class="font-bold">Fast Delivery</p></div>
            <div><i class="fa-solid fa-rotate-left text-rose-600 mb-1 text-sm"></i><p class="font-bold">Easy Verification</p></div>
        </div>
    </section>

    <!-- CATALOG MAIN SECTION -->
    <main class="max-w-6xl mx-auto px-4">
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-bold text-slate-900 flex items-center gap-1.5">
                <i class="fa-solid fa-fire text-amber-500"></i> Trending Ethnic Catalog
            </h2>
            <span class="text-[11px] bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-semibold">Demo Items</span>
        </div>

        <!-- DEMO PRODUCTS GRID -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            
            <!-- Sample Card 1 -->
            <div class="bg-white rounded-xl overflow-hidden border border-slate-200 shadow-xs flex flex-col justify-between">
                <div>
                    <div class="relative bg-slate-100 aspect-3/4 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=500" class="w-full h-full object-cover" loading="lazy">
                        <span class="absolute top-2 left-2 bg-slate-900/80 text-white text-[9px] font-bold px-2 py-0.5 rounded">D.NO-101</span>
                    </div>
                    <div class="p-2.5">
                        <h3 class="font-bold text-xs text-slate-800 truncate">Designer Kurti Set</h3>
                        <p class="text-[10px] text-slate-500 mb-1">Color: Pink</p>
                        <div class="flex items-baseline gap-2">
                            <span class="text-sm font-black text-rose-600">₹899</span>
                            <span class="text-[10px] text-slate-400 line-through">₹1299</span>
                        </div>
                    </div>
                </div>
                <div class="p-2.5 pt-0">
                    <button class="w-full bg-rose-600 text-white font-bold text-[11px] py-1.5 rounded-lg shadow-xs opacity-90">Add to Cart</button>
                </div>
            </div>

            <!-- Sample Card 2 -->
            <div class="bg-white rounded-xl overflow-hidden border border-slate-200 shadow-xs flex flex-col justify-between">
                <div>
                    <div class="relative bg-slate-100 aspect-3/4 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=500" class="w-full h-full object-cover" loading="lazy">
                        <span class="absolute top-2 left-2 bg-slate-900/80 text-white text-[9px] font-bold px-2 py-0.5 rounded">D.NO-102</span>
                    </div>
                    <div class="p-2.5">
                        <h3 class="font-bold text-xs text-slate-800 truncate">Rayon Anarkali Suit</h3>
                        <p class="text-[10px] text-slate-500 mb-1">Color: Maroon</p>
                        <div class="flex items-baseline gap-2">
                            <span class="text-sm font-black text-rose-600">₹1199</span>
                            <span class="text-[10px] text-slate-400 line-through">₹1699</span>
                        </div>
                    </div>
                </div>
                <div class="p-2.5 pt-0">
                    <button class="w-full bg-rose-600 text-white font-bold text-[11px] py-1.5 rounded-lg shadow-xs opacity-90">Add to Cart</button>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
