<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Amane Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --wine: #6B1B38;
            --wine-deep: #4A1226;
            --cream: #FAF7F2;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cream);
            color: #1f2937;
        }
        .font-display { font-family: 'Fraunces', serif; }
        .btn-wine { background-color: var(--wine); color: white; transition: all 0.2s ease; }
        .btn-wine:hover { background-color: var(--wine-deep); }
        .card-solid { background: #ffffff; border: 1px solid #f3e8ff; box-shadow: 0 4px 20px -2px rgba(107, 27, 56, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between py-8 px-4">

    <!-- Header -->
    <header class="w-full max-w-md mx-auto text-center mb-6">
        <a href="index.html" class="inline-block font-display text-3xl font-bold tracking-wide" style="color: var(--wine);">
            AMANE STORE
        </a>
        <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">Customer Portal</p>
    </header>

    <!-- Main Box -->
    <main class="w-full max-w-md mx-auto card-solid rounded-2xl p-6 sm:p-8">
        
        <!-- Tabs -->
        <div class="flex rounded-xl bg-gray-100 p-1 mb-6">
            <button id="tabLoginBtn" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-white shadow-sm" style="color: var(--wine);">
                Sign In
            </button>
            <button id="tabSignupBtn" onclick="switchTab('signup')" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-500 hover:text-gray-900">
                Create Account
            </button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Email Address</label>
                <input type="email" id="loginEmail" required placeholder="yourname@gmail.com" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#6B1B38] text-sm bg-gray-50">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#6B1B38] text-sm bg-gray-50">
            </div>
            <button type="submit" id="loginBtn" class="w-full py-3.5 rounded-xl btn-wine font-medium text-sm tracking-wide shadow-md flex items-center justify-center gap-2">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Full Name</label>
                <input type="text" id="signupName" required placeholder="Aarav Sharma" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#6B1B38] text-sm bg-gray-50">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Email Address</label>
                <input type="email" id="signupEmail" required placeholder="yourname@gmail.com" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#6B1B38] text-sm bg-gray-50">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Password (Min 6 chars)</label>
                <input type="password" id="signupPassword" required minlength="6" placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#6B1B38] text-sm bg-gray-50">
            </div>
            <button type="submit" id="signupBtn" class="w-full py-3.5 rounded-xl btn-wine font-medium text-sm tracking-wide shadow-md flex items-center justify-center gap-2">
                <span>Create Account</span>
                <i class="fa-solid fa-user-plus text-xs"></i>
            </button>
        </form>

        <div class="my-5 flex items-center gap-3 text-[10px] font-bold uppercase tracking-widest text-gray-400"><span class="h-px flex-1 bg-gray-100"></span>or<span class="h-px flex-1 bg-gray-100"></span></div>
        <button type="button" onclick="signInWithGoogle()" class="w-full py-3 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 font-semibold text-sm flex items-center justify-center gap-2 transition">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="w-5 h-5"><path fill="#4285F4" d="M21.35 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.52h3.14c1.84-1.7 2.91-4.2 2.91-7.29Z"/><path fill="#34A853" d="M12 21.74c2.63 0 4.83-.87 6.44-2.36l-3.14-2.43c-.87.59-1.99.94-3.3.94-2.54 0-4.7-1.72-5.47-4.03H3.29v2.51A9.73 9.73 0 0 0 12 21.74Z"/><path fill="#FBBC05" d="M6.53 13.86a5.85 5.85 0 0 1 0-3.72V7.63H3.29a9.73 9.73 0 0 0 0 8.74l3.24-2.51Z"/><path fill="#EA4335" d="M12 6.11c1.43 0 2.71.49 3.72 1.45l2.78-2.77C16.82 3.22 14.62 2.26 12 2.26a9.73 9.73 0 0 0-8.71 5.37l3.24 2.51C7.3 7.83 9.46 6.11 12 6.11Z"/></svg>
            Continue with Google
        </button>
        <p id="authMessage" class="hidden text-center text-xs mt-3" role="status"></p>
        <div class="text-center mt-6 pt-4 border-t border-gray-100">
            <button type="button" onclick="sendPasswordReset()" class="text-xs text-gray-500 hover:text-[#6B1B38] font-medium transition-colors mb-3">Forgot password?</button><br>
            <a href="index.html" class="text-xs text-gray-500 hover:text-[#6B1B38] font-medium transition-colors">
                <i class="fa-solid fa-store mr-1"></i> Back to Storefront
            </a>
        </div>
    </main>

    <footer class="text-center text-xs text-gray-400 mt-6">&copy; 2026 Amane Store. All rights reserved.</footer>

    <script>
        const SUPABASE_URL = 'https://mthkwrtfruhgcjmuwjih.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_HhSa_JJrkH06xHsv7_sgQQ_Gtz-zyGc';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showAuthMessage(message, isError = false) { const el = document.getElementById('authMessage'); el.textContent = message; el.className = `text-center text-xs mt-3 ${isError ? 'text-rose-600' : 'text-emerald-600'}`; }

        async function signInWithGoogle() {
            const { error } = await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: `${window.location.origin}${window.location.pathname.replace(/[^/]+$/, '')}index.html` } });
            if (error) showAuthMessage(error.message, true);
        }

        async function sendPasswordReset() {
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) { showAuthMessage('Enter your email above first, then choose Forgot password.', true); return; }
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
            showAuthMessage(error ? error.message : 'Password reset email sent. Please check your inbox.', Boolean(error));
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginBtn = document.getElementById('tabLoginBtn');
            const signupBtn = document.getElementById('tabSignupBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginBtn.className = 'flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-white shadow-sm';
                loginBtn.style.color = 'var(--wine)';
                signupBtn.className = 'flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-500 hover:text-gray-900';
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                signupBtn.className = 'flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-white shadow-sm';
                signupBtn.style.color = 'var(--wine)';
                loginBtn.className = 'flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-500 hover:text-gray-900';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Signing In...`;

            try {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                showAuthMessage('Signed in successfully. Opening your account…');
                window.location.href = 'index.html';
            } catch (err) {
                alert('Login Failed: ' + err.message);
                btn.disabled = false;
                btn.innerHTML = `<span>Sign In</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const btn = document.getElementById('signupBtn');

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...`;

            try {
                const { error } = await supabaseClient.auth.signUp({
                    email, password, options: { data: { full_name: name } }
                });
                if (error) throw error;
                showAuthMessage('Account created. Check your email to confirm your address, then sign in.');
                btn.disabled = false;
                btn.innerHTML = `<span>Create Account</span> <i class="fa-solid fa-user-plus text-xs"></i>`;
            } catch (err) {
                alert('Signup Failed: ' + err.message);
                btn.disabled = false;
                btn.innerHTML = `<span>Create Account</span> <i class="fa-solid fa-user-plus text-xs"></i>`;
            }
        }
    </script>
</body>
</html>
