<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account — Amane Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --wine: #6B1B38;
            --wine-deep: #4A1226;
            --gold: #C89B4A;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: #FAF7F2; }
        .font-display { font-family: 'Fraunces', Georgia, serif; }
        .site-nav { background: #FFFFFF; border-bottom: 1px solid #F0E9E2; box-shadow: 0 1px 3px rgba(74,18,38,0.05); }
        .card { background: #FFFFFF; border: 1px solid #F1EAE3; box-shadow: 0 2px 10px -2px rgba(107,27,56,0.07); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 pb-10 min-h-screen">

    <!-- Header -->
    <header class="site-nav sticky top-0 z-30">
        <div class="max-w-3xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <a href="index.html" class="flex flex-col leading-none">
                <h1 class="font-display text-lg font-semibold tracking-tight text-slate-900">Amane <span class="italic text-rose-600">Store</span></h1>
                <span class="text-[9px] font-bold tracking-[0.2em] uppercase text-[color:var(--gold)] mt-0.5">My Account</span>
            </a>
            <div class="flex items-center gap-2">
                <a href="index.html" class="text-xs text-slate-500 font-bold hover:text-rose-600 transition"><i class="fa-solid fa-store text-[10px] mr-1"></i>Store</a>
                <button onclick="handleCustomerLogout()" class="text-xs bg-rose-50 text-rose-600 hover:bg-rose-100 font-bold px-3 py-2 rounded-2xl transition cursor-pointer">Logout</button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-4 space-y-4">

        <!-- Not logged in state -->
        <div id="loggedOutState" class="hidden card rounded-3xl p-8 text-center space-y-3">
            <i class="fa-solid fa-user-lock text-3xl text-slate-300"></i>
            <p class="text-sm font-bold text-slate-700">Please login to view your account</p>
            <a href="customerlogin.html" class="inline-block bg-rose-600 hover:bg-rose-700 text-white font-extrabold px-5 py-2.5 rounded-2xl text-xs transition">Go to Login</a>
        </div>

        <div id="accountContent" class="hidden space-y-4">
            <!-- Welcome -->
            <div class="card rounded-3xl p-4">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Welcome back</p>
                <h2 id="customerNameDisplay" class="font-display text-lg font-semibold text-slate-900 mt-0.5"></h2>
            </div>

            <!-- Tabs -->
            <div class="card rounded-2xl p-1.5 flex gap-1.5">
                <button id="tabBtnOrders" onclick="switchAccountTab('orders')" class="flex-1 py-2.5 rounded-xl text-xs font-extrabold bg-slate-900 text-white transition cursor-pointer">
                    <i class="fa-solid fa-receipt mr-1"></i> Orders
                </button>
                <button id="tabBtnWishlist" onclick="switchAccountTab('wishlist')" class="flex-1 py-2.5 rounded-xl text-xs font-extrabold text-slate-600 transition cursor-pointer">
                    <i class="fa-solid fa-heart mr-1"></i> Wishlist
                </button>
                <button id="tabBtnReviews" onclick="switchAccountTab('reviews')" class="flex-1 py-2.5 rounded-xl text-xs font-extrabold text-slate-600 transition cursor-pointer">
                    <i class="fa-solid fa-star mr-1"></i> Reviews
                </button>
            </div>

            <!-- Orders Tab -->
            <div id="ordersTab" class="space-y-2.5">
                <p class="text-xs text-slate-400 text-center py-6">Loading your orders...</p>
            </div>

            <!-- Wishlist Tab -->
            <div id="wishlistTab" class="hidden grid grid-cols-2 gap-2.5">
                <p class="text-xs text-slate-400 text-center py-6 col-span-2">Loading your wishlist...</p>
            </div>

            <!-- Reviews Tab -->
            <div id="reviewsTab" class="hidden space-y-2.5">
                <p class="text-xs text-slate-400 text-center py-6">Loading your reviews...</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://mthkwrtfruhgcjmuwjih.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_HhSa_JJrkH06xHsv7_sgQQ_Gtz-zyGc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentCustomer = null;
        const ORDER_STATUS_COLORS = {
            'Pending': 'bg-amber-100 text-amber-700',
            'Confirmed': 'bg-blue-100 text-blue-700',
            'Dispatched': 'bg-violet-100 text-violet-700',
            'Delivered': 'bg-emerald-100 text-emerald-700',
            'Cancelled': 'bg-rose-100 text-rose-700'
        };

        window.onload = async function() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                document.getElementById('loggedOutState').classList.remove('hidden');
                return;
            }
            currentCustomer = session.user;
            document.getElementById('accountContent').classList.remove('hidden');
            document.getElementById('customerNameDisplay').innerText = currentCustomer.user_metadata?.full_name || currentCustomer.email;

            loadOrders();
        };

        async function handleCustomerLogout() {
            await _supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        function switchAccountTab(tab) {
            ['orders', 'wishlist', 'reviews'].forEach(t => {
                document.getElementById(`${t}Tab`).classList.toggle('hidden', t !== tab);
                const btn = document.getElementById(`tabBtn${t.charAt(0).toUpperCase() + t.slice(1)}`);
                btn.className = t === tab
                    ? 'flex-1 py-2.5 rounded-xl text-xs font-extrabold bg-slate-900 text-white transition cursor-pointer'
                    : 'flex-1 py-2.5 rounded-xl text-xs font-extrabold text-slate-600 transition cursor-pointer';
            });
            if (tab === 'wishlist') loadWishlist();
            if (tab === 'reviews') loadMyReviews();
        }

        // ---- Orders ----
        async function loadOrders() {
            const el = document.getElementById('ordersTab');
            const { data, error } = await _supabase
                .from('orders')
                .select('*')
                .eq('customer_id', currentCustomer.id)
                .order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                el.innerHTML = `<div class="card rounded-3xl p-8 text-center"><i class="fa-solid fa-box-open text-2xl text-slate-300"></i><p class="text-xs text-slate-400 mt-2">No orders yet. Orders placed while logged in will show up here.</p></div>`;
                return;
            }

            el.innerHTML = data.map(o => {
                const status = o.status || 'Pending';
                const colorClass = ORDER_STATUS_COLORS[status] || 'bg-slate-100 text-slate-600';
                const orderDate = o.created_at ? new Date(o.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
                return `
                    <div class="card rounded-2xl p-3.5 text-xs space-y-1.5">
                        <div class="flex items-start justify-between">
                            <p class="text-[10px] text-slate-400 font-bold">${orderDate}</p>
                            <span class="px-2 py-0.5 rounded-lg text-[10px] font-extrabold ${colorClass}">${status}</span>
                        </div>
                        <p class="text-slate-700 leading-relaxed">${o.items || ''}</p>
                        <p class="font-bold text-slate-900">Total: ₹${o.total_amount ?? '-'} <span class="text-slate-400 font-normal">· ${o.payment_mode || ''}</span></p>
                    </div>
                `;
            }).join('');
        }

        // ---- Wishlist ----
        async function loadWishlist() {
            const el = document.getElementById('wishlistTab');
            const { data: wishRows, error } = await _supabase
                .from('wishlist')
                .select('product_id')
                .eq('customer_id', currentCustomer.id);

            if (error || !wishRows || wishRows.length === 0) {
                el.innerHTML = `<div class="card rounded-3xl p-8 text-center col-span-2"><i class="fa-solid fa-heart-crack text-2xl text-slate-300"></i><p class="text-xs text-slate-400 mt-2">Your wishlist is empty. Tap the heart icon on any product to save it here.</p></div>`;
                return;
            }

            const productIds = wishRows.map(r => r.product_id);
            const { data: products } = await _supabase.from('products').select('*').in('id', productIds);

            if (!products || products.length === 0) {
                el.innerHTML = `<p class="text-xs text-slate-400 text-center py-6 col-span-2">Could not load wishlist items.</p>`;
                return;
            }

            el.innerHTML = products.map(p => {
                let imgArr = [];
                try { imgArr = typeof p.images === 'string' ? JSON.parse(p.images) : (p.images || []); } catch (e) { imgArr = []; }
                const coverImg = imgArr[0] || '';
                return `
                    <div class="card rounded-2xl p-2.5 relative">
                        <button onclick="removeFromWishlist('${p.id}')" class="absolute top-2 right-2 z-10 w-6 h-6 rounded-full bg-white shadow-md flex items-center justify-center text-rose-600 cursor-pointer"><i class="fa-solid fa-xmark text-[10px]"></i></button>
                        <div class="aspect-[3/4] bg-slate-100 rounded-xl overflow-hidden mb-2"><img src="${coverImg}" class="w-full h-full object-contain"></div>
                        <h4 class="text-[11px] font-bold text-slate-900 line-clamp-1">${p.title}</h4>
                        <p class="text-xs font-semibold text-slate-800 mt-0.5">₹${p.price}</p>
                        <a href="index.html?product=${p.id}" class="block text-center mt-1.5 bg-slate-900 text-white text-[10px] font-extrabold py-1.5 rounded-xl">View Product</a>
                    </div>
                `;
            }).join('');
        }

        async function removeFromWishlist(productId) {
            await _supabase.from('wishlist').delete().eq('customer_id', currentCustomer.id).eq('product_id', productId);
            loadWishlist();
        }

        // ---- Reviews ----
        async function loadMyReviews() {
            const el = document.getElementById('reviewsTab');
            const { data, error } = await _supabase
                .from('reviews')
                .select('*')
                .eq('customer_id', currentCustomer.id)
                .order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                el.innerHTML = `<div class="card rounded-3xl p-8 text-center"><i class="fa-solid fa-star-half-stroke text-2xl text-slate-300"></i><p class="text-xs text-slate-400 mt-2">You haven't written any reviews yet.</p></div>`;
                return;
            }

            const productIds = [...new Set(data.map(r => r.product_id))];
            const { data: products } = await _supabase.from('products').select('id, title').in('id', productIds);
            const productMap = {};
            (products || []).forEach(p => productMap[p.id] = p.title);

            el.innerHTML = data.map(r => `
                <div class="card rounded-2xl p-3.5 text-xs space-y-1">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-900">${productMap[r.product_id] || 'Product'}</span>
                        <span class="px-2 py-0.5 rounded-lg text-[9px] font-extrabold ${r.approved ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${r.approved ? 'Published' : 'Pending Approval'}</span>
                    </div>
                    <span class="text-[color:var(--gold)] text-[11px]">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                    ${r.review_text ? `<p class="text-slate-600 leading-relaxed">${r.review_text}</p>` : ''}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
