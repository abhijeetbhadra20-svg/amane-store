<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Femme &amp; Co.</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account">

<div id="content" class="max-w-4xl mx-auto px-5 py-10"></div>

<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
  const user = Store.currentUser();
  const content = document.getElementById("content");

  if(!user){
    content.innerHTML = `
      <div class="text-center py-20">
        <h1 class="display text-2xl mb-3">Login to view your account</h1>
        <p class="text-sm mb-6" style="color:var(--plum-soft)">Track orders, manage your wishlist and save addresses.</p>
        <a href="login.html?redirect=account.html" class="btn btn-primary">Login with phone</a>
      </div>`;
  } else {
    const orders = Store.getOrdersForUser(user.phone).slice().reverse();
    const wishlist = Store.getWishlist().map(id=>Store.getProduct(id)).filter(Boolean);

    content.innerHTML = `
      <div class="flex justify-between items-center mb-8">
        <div>
          <div class="eyebrow mb-1">My account</div>
          <h1 class="display text-2xl">${user.name || user.phone}</h1>
        </div>
        <button class="btn btn-outline" onclick="Store.logout(); location.reload();">Logout</button>
      </div>

      <div class="card p-5 mb-10">
        <div class="eyebrow mb-3">Profile</div>
        <div class="grid md:grid-cols-2 gap-3">
          <div><label>Name</label><input type="text" id="name" value="${user.name||''}"></div>
          <div><label>Phone</label><input type="text" value="${user.phone}" disabled></div>
        </div>
        <button class="btn btn-primary mt-4" onclick="saveName()">Save</button>
      </div>

      <h2 class="display text-xl mb-4">My orders</h2>
      <div id="orders" class="flex flex-col gap-4 mb-12">
        ${orders.length ? orders.map(orderCard).join("") : `<p class="text-sm" style="color:var(--plum-soft)">No orders yet. <a href="shop.html" class="underline">Start shopping</a></p>`}
      </div>

      <h2 class="display text-xl mb-4" id="wishlist">Wishlist</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-5">
        ${wishlist.length ? wishlist.map(p=>`
          <div class="product-card card">
            <a href="product.html?id=${p.id}"><img src="${p.img}" alt="${p.name}"></a>
            <div class="p-3">
              <div class="eyebrow">${p.category}</div>
              <a href="product.html?id=${p.id}" class="text-sm font-bold block mt-1">${p.name}</a>
              <div class="price text-sm mt-1">₹${p.price}</div>
            </div>
          </div>`).join("") : `<p class="text-sm col-span-full" style="color:var(--plum-soft)">Nothing saved yet.</p>`}
      </div>
    `;
  }

  function orderCard(o){
    const stages = Store.ORDER_STAGES;
    const currentIdx = stages.indexOf(o.status);
    return `
    <div class="card p-5">
      <div class="flex justify-between items-start flex-wrap gap-2">
        <div>
          <div class="mono text-sm font-bold">${o.id}</div>
          <div class="text-xs mt-1" style="color:var(--plum-soft)">Placed ${new Date(o.placedAt).toLocaleDateString()}</div>
        </div>
        <span class="status-pill status-${o.status.toLowerCase().replace(/\s/g,'')}">${o.status}</span>
      </div>
      <div class="flex items-center gap-1 mt-4 mb-3 overflow-x-auto">
        ${stages.map((s,i)=>`
          <div class="flex items-center gap-1">
            <div class="w-2 h-2 rounded-full" style="background:${i<=currentIdx?'var(--sage)':'var(--line)'}"></div>
            <span class="text-[10px] whitespace-nowrap" style="color:${i<=currentIdx?'var(--plum)':'var(--plum-soft)'}">${s}</span>
            ${i<stages.length-1?`<div class="w-4 h-px" style="background:${i<currentIdx?'var(--sage)':'var(--line)'}"></div>`:''}
          </div>`).join("")}
      </div>
      ${o.trackingNo ? `<div class="text-xs mb-2">Tracking No: <span class="mono">${o.trackingNo}</span></div>` : ''}
      <div class="text-xs" style="color:var(--plum-soft)">${o.items.map(i=>i.name+' × '+i.qty).join(", ")}</div>
      <div class="text-sm font-bold mt-2">₹${o.total}</div>
    </div>`;
  }

  function saveName(){
    const name = document.getElementById("name").value.trim();
    Store.updateProfile({name});
    Store.toast("Profile updated");
  }
</script>
</body>
</html>
