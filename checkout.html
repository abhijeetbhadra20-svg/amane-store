<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Femme &amp; Co.</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">

<section class="max-w-5xl mx-auto px-5 py-10 grid md:grid-cols-5 gap-10">
  <div class="md:col-span-3">
    <h1 class="display text-3xl mb-8">Checkout</h1>

    <div class="card p-5 mb-6">
      <div class="eyebrow mb-4">Delivery address</div>
      <div class="grid grid-cols-2 gap-3">
        <div class="col-span-2"><label>Full name</label><input type="text" id="name"></div>
        <div><label>Phone</label><input type="tel" id="phone" maxlength="10"></div>
        <div><label>Pincode</label><input type="text" id="pincode" maxlength="6"></div>
        <div class="col-span-2"><label>Address (house no, street, area)</label><textarea id="address" rows="2"></textarea></div>
        <div><label>City</label><input type="text" id="city"></div>
        <div><label>State</label><input type="text" id="state"></div>
      </div>
      <p class="text-xs mt-2" id="pincode-msg" style="color:var(--plum-soft)"></p>
    </div>

    <div class="card p-5">
      <div class="eyebrow mb-4">Payment method</div>
      <div class="flex flex-col gap-2 text-sm">
        <label class="flex items-center gap-2"><input type="radio" name="pay" value="upi" checked> UPI / Cards / Netbanking (Razorpay)</label>
        <label class="flex items-center gap-2"><input type="radio" name="pay" value="cod"> Cash on delivery</label>
      </div>
      <p class="text-xs mt-3" style="color:var(--plum-soft)">Demo checkout — no real payment is charged. See README.md to connect a live Razorpay account.</p>
    </div>
  </div>

  <div class="md:col-span-2">
    <div class="card p-5">
      <div class="eyebrow mb-4">Order summary</div>
      <div id="items" class="flex flex-col gap-3 mb-4 text-sm"></div>
      <hr class="stitch my-3">
      <div class="flex justify-between text-sm mb-1"><span>Subtotal</span><span id="subtotal">₹0</span></div>
      <div class="flex justify-between text-sm mb-3"><span>Shipping</span><span>Free</span></div>
      <div class="flex justify-between font-bold mb-5"><span>Total</span><span id="total">₹0</span></div>
      <button class="btn btn-primary btn-block" onclick="placeOrder()">Place order</button>
    </div>
  </div>
</section>

<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
  const cart = Store.getCart();
  if(cart.length === 0){ location.href = "cart.html"; }

  document.getElementById("items").innerHTML = cart.map(i=>{
    const p = Store.getProduct(i.productId);
    return `<div class="flex justify-between"><span>${p.name} (${i.size}) × ${i.qty}</span><span>₹${p.price*i.qty}</span></div>`;
  }).join("");
  const total = Store.cartTotal();
  document.getElementById("subtotal").textContent = "₹" + total;
  document.getElementById("total").textContent = "₹" + total;

  const user = Store.currentUser();
  if(user){ document.getElementById("phone").value = user.phone.replace("+91",""); }

  document.getElementById("pincode").addEventListener("input", e=>{
    const pin = e.target.value.trim();
    const msg = document.getElementById("pincode-msg");
    if(pin.length === 6){
      const info = Store.lookupPincode(pin);
      if(info){
        document.getElementById("city").value = info.city;
        document.getElementById("state").value = info.state;
        msg.textContent = "Serviceable — " + info.city + ", " + info.state;
        msg.style.color = "var(--sage)";
      } else {
        msg.textContent = "Demo only has a few sample pincodes (110001, 400001, 560001, 700001, 380001). Enter city/state manually.";
        msg.style.color = "var(--plum-soft)";
      }
    } else { msg.textContent = ""; }
  });

  function placeOrder(){
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const pincode = document.getElementById("pincode").value.trim();
    const address = document.getElementById("address").value.trim();
    const city = document.getElementById("city").value.trim();
    const state = document.getElementById("state").value.trim();
    const payment = document.querySelector('input[name="pay"]:checked').value;

    if(!name || !phone || !pincode || !address || !city || !state){
      Store.toast("Please fill in all address fields");
      return;
    }
    const order = Store.placeOrder({
      name, phone, pincode, address, city, state, payment,
      items: cart.map(i=>({...i, price: Store.getProduct(i.productId).price, name: Store.getProduct(i.productId).name})),
      total
    });
    location.href = "order-confirmation.html?id=" + order.id;
  }
</script>
</body>
</html>
