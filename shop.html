<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Femme &amp; Co.</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">

<section class="max-w-6xl mx-auto px-5 pt-8 pb-4">
  <div class="eyebrow mb-2">Catalog</div>
  <h1 class="display text-3xl">Shop all</h1>
</section>

<section class="max-w-6xl mx-auto px-5 pb-20 grid md:grid-cols-4 gap-8">
  <aside class="md:col-span-1">
    <div class="card p-4 mb-4">
      <input type="text" id="search" placeholder="Search products...">
    </div>
    <div class="card p-4 mb-4">
      <div class="eyebrow mb-3">Category</div>
      <div id="cat-filters" class="flex flex-col gap-2 text-sm"></div>
    </div>
    <div class="card p-4 mb-4">
      <div class="eyebrow mb-3">Size</div>
      <div id="size-filters" class="flex flex-wrap gap-2"></div>
    </div>
    <div class="card p-4">
      <div class="eyebrow mb-3">Price</div>
      <input type="range" id="price-max" min="500" max="5000" step="100" value="5000" class="w-full">
      <div class="text-xs mt-1" style="color:var(--plum-soft)">Up to ₹<span id="price-label">5000</span></div>
    </div>
  </aside>

  <div class="md:col-span-3">
    <div class="flex justify-between items-center mb-4">
      <div class="text-xs" id="result-count" style="color:var(--plum-soft)"></div>
      <select id="sort" class="w-auto text-xs">
        <option value="default">Sort: Featured</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
        <option value="rating">Rating</option>
      </select>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-3 gap-5" id="grid"></div>
    <div id="empty" class="hidden text-center py-16" style="color:var(--plum-soft)">No products match your filters.</div>
  </div>
</section>

<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const state = { category: params.get("category") || "", sizes: new Set(), search: "", priceMax: 5000, sort: "default" };

  document.getElementById("cat-filters").innerHTML = `
    <label class="flex items-center gap-2"><input type="radio" name="cat" value="" ${!state.category?'checked':''}> All</label>
    ${CATEGORIES.map(c=>`<label class="flex items-center gap-2"><input type="radio" name="cat" value="${c}" ${state.category===c?'checked':''}> ${c}</label>`).join("")}
  `;
  document.getElementById("size-filters").innerHTML = SIZES.map(s=>`
    <label class="border px-2 py-1 text-xs cursor-pointer" style="border-color:var(--line)">
      <input type="checkbox" value="${s}" class="hidden size-cb"> ${s}
    </label>`).join("");

  document.querySelectorAll('input[name="cat"]').forEach(r=>r.addEventListener("change",e=>{state.category=e.target.value; render();}));
  document.querySelectorAll(".size-cb").forEach(cb=>cb.addEventListener("change",e=>{
    e.target.checked ? state.sizes.add(e.target.value) : state.sizes.delete(e.target.value);
    e.target.closest("label").style.background = e.target.checked ? "var(--plum)" : "";
    e.target.closest("label").style.color = e.target.checked ? "var(--ivory)" : "";
    render();
  }));
  document.getElementById("search").addEventListener("input", e=>{state.search=e.target.value.toLowerCase(); render();});
  document.getElementById("price-max").addEventListener("input", e=>{state.priceMax=+e.target.value; document.getElementById("price-label").textContent=e.target.value; render();});
  document.getElementById("sort").addEventListener("change", e=>{state.sort=e.target.value; render();});

  function productCard(p){
    const inWish = Store.getWishlist().includes(p.id);
    return `
    <div class="product-card card">
      <a href="product.html?id=${p.id}"><img src="${p.img}" alt="${p.name}"></a>
      <div class="wish-btn ${inWish?'active':''}" onclick="toggleWish('${p.id}', this)">
        <i class="fa-${inWish?'solid':'regular'} fa-heart"></i>
      </div>
      <div class="p-3">
        <div class="eyebrow">${p.category}</div>
        <a href="product.html?id=${p.id}" class="text-sm font-bold block mt-1">${p.name}</a>
        <div class="price text-sm mt-1">₹${p.price} <span class="line-through text-xs" style="color:var(--plum-soft)">₹${p.mrp}</span></div>
        <div class="text-xs mt-1"><i class="fa-solid fa-star" style="color:var(--brass)"></i> ${p.rating} (${p.reviews})</div>
      </div>
    </div>`;
  }
  function toggleWish(id, el){
    const active = Store.toggleWishlist(id);
    el.classList.toggle('active', active);
    el.querySelector('i').className = `fa-${active?'solid':'regular'} fa-heart`;
    Store.toast(active ? "Added to wishlist" : "Removed from wishlist");
  }

  function render(){
    let list = PRODUCTS.filter(p=>{
      if(state.category && p.category !== state.category) return false;
      if(state.sizes.size && ![...state.sizes].some(s=>true)) {} // all products have all sizes in this demo
      if(state.search && !p.name.toLowerCase().includes(state.search)) return false;
      if(p.price > state.priceMax) return false;
      return true;
    });
    if(state.sort==="low") list.sort((a,b)=>a.price-b.price);
    if(state.sort==="high") list.sort((a,b)=>b.price-a.price);
    if(state.sort==="rating") list.sort((a,b)=>b.rating-a.rating);

    document.getElementById("grid").innerHTML = list.map(productCard).join("");
    document.getElementById("result-count").textContent = `${list.length} product${list.length!==1?'s':''}`;
    document.getElementById("empty").classList.toggle("hidden", list.length>0);
  }
  render();
</script>
</body>
</html>
