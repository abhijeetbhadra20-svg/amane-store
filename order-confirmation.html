<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — Femme &amp; Co.</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="confirm">

<section class="max-w-xl mx-auto px-5 py-20 text-center">
  <i class="fa-solid fa-circle-check text-4xl" style="color:var(--sage)"></i>
  <h1 class="display text-3xl mt-5">Order placed</h1>
  <p class="text-sm mt-2" style="color:var(--plum-soft)">A confirmation has been sent to your email/SMS (demo).</p>
  <div class="card p-5 mt-8 text-left" id="order-box"></div>
  <a href="account.html" class="btn btn-primary mt-8">Track your order</a>
</section>

<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
  const id = new URLSearchParams(location.search).get("id");
  const order = Store.getOrders().find(o=>o.id===id);
  if(order){
    document.getElementById("order-box").innerHTML = `
      <div class="flex justify-between text-sm mb-2"><span>Order ID</span><span class="mono font-bold">${order.id}</span></div>
      <div class="flex justify-between text-sm mb-2"><span>Delivering to</span><span>${order.city}, ${order.state}</span></div>
      <div class="flex justify-between text-sm mb-2"><span>Payment</span><span>${order.payment==='cod'?'Cash on delivery':'UPI / Card'}</span></div>
      <div class="flex justify-between text-sm font-bold"><span>Total</span><span>₹${order.total}</span></div>
    `;
  }
</script>
</body>
</html>
